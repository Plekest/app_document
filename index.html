<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicação de Documentação Técnica</title>

    <!-- Main Build -->
    <script type="module" src="env.js"></script>
    <script type="module" src="./app/main.js"></script>

    <!-- Style -->
    <link rel="stylesheet" type="text/css" href="src/css/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs-tomorrow-theme@0.0.1/prism-tomorrow.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <!-- Jspreadsheet -->
    <script src="https://cdn.jsdelivr.net/npm/jspreadsheet@11/dist/index.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet@11/dist/jspreadsheet.min.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites/dist/jsuites.min.css" type="text/css" />

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://unpkg.com/navigo@8.11.1/lib/navigo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="text-center">
    <nav class="flex items-center justify-center">
      <h1 class="text-5xl font-extrabold text-center mb-5 pb-5 pr-10">
        Jspread<span class="text-red-500">sheet</span>
        <span class="bg-red-500 text-gray-200 text-2xl font-semibold inline-block px-2.5 py-0.5 rounded-sm ms-2">Doc</span>
      </h1>
      <ul class="pt-5 pb-10 pl-10 flex space-x-2">
        <li>
          <button data-framework="html" type="button" class="cursor-pointer">
            <img src="src/assets/icons/javascript.png" alt="ícone javascript" class="w-8 h-8" />
          </button>
        </li>
      
        <li>
          <button data-framework="jsx" type="button" class="cursor-pointer">
            <img src="src/assets/icons/react.png" alt="ícone react" class="w-8 h-8" />
          </button>
        </li>
      
        <li>
          <button data-framework="vue" type="button" class="cursor-pointer">
            <img src="src/assets/icons/vue.png" alt="ícone vue" class="w-8 h-8" />
          </button>
        </li>
      </ul>
    </nav>
    
    <div class="flex text-left justify-center">
      <div
      id="doc-content-index"
      class="space-y-4 text-base leading-relaxed 
      [&>h1]:text-3xl [&>h1]:font-bold [&>h1]:mb-4 [&>h1]:text-gray-200 
      [&>h2]:text-2xl [&>h2]:font-semibold [&>h2]:mt-6 [&>h2]:mb-3 [&>h2]:text-gray-300 
      [&>h3]:text-xl [&>h3]:font-semibold [&>h3]:mt-10 [&>h3]:text-gray-400 
      [&>p]:mb-10 [&>p]:text-left
      [&>p>a]:text-green-200 [&>p>a]:underline
      [&>table]:text-sm [&>table]:text-left [&>table]:rounded-t-sm [&>table]:overflow-hidden      
      [&>table>thead]:text-xs [&>table>thead]:uppercase [&>table>thead]:bg-gray-600 
      [&>table>tbody>tr>td]:pr-10
      [&>table>tbody>tr]:border-b [&>table>tbody>tr]:border-gray-600
      max-w-4xl w-full px-4"
      ></div>
    </div>
    <div class="text-left justify-center w-full px-4 max-w-4xl mx-auto">
      <div id='spreadsheet' class="pl-10"></div>
      <p class="mt-10 ml-5 text-left">See this code example</p>
      <div id="doc-content-language"></div>
    </div>
  </body>
  <script>
    jspreadsheet.setLicense('###license###');

    jspreadsheet(document.getElementById('spreadsheet'), {
        worksheets: [{
            data: [
                ['Mazda', 2001, 2000],
                ['Peugeot', 2010, 5000],
                ['Honda Fit', 2009, 3000],
                ['Honda CRV', 2010, 6000],
            ],
            columns: [
                { title:'Model', width:'300px' },
                { title:'Year', width:'80px' },
                { title:'Price', width:'100px' },
            ]
        }]
    });
  </script>
</html>
