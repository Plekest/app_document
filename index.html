<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicação de Documentação Técnica</title>

    <!-- Main Build -->
    <script type="module" src="env.js"></script>
    <script type="module" src="./app/main.js"></script>

    <!-- Style -->
    <link rel="stylesheet" type="text/css" href="src/css/main.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs-tomorrow-theme@0.0.1/prism-tomorrow.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css"
      rel="stylesheet"
    />

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://unpkg.com/navigo@8.11.1/lib/navigo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.2/dist/purify.min.js"></script>
  </head>
  <body class="text-center">
    <h1 class="text-5xl font-extrabold text-center mb-5">
      Jspread<span class="text-red-500">sheet</span
      ><span
        class="bg-red-500 text-gray-200 text-2xl font-semibold inline-block px-2.5 py-0.5 rounded-sm ms-2"
        >Doc</span
      >
    </h1>
    <ul class="pt-5">
      <button
        data-framework="jsx"
        type="button"
        class="text-gray-900 bg-gradient-to-r from-yellow-200 via-yellow-300 to-gray-200 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2"
      >
        <img src="src/assets/icons/javascript.png" alt="ícone javascript" />
      </button>

      <button
        data-framework="angularjs"
        type="button"
        class="text-gray-900 bg-gradient-to-r from-gray-400 via-gray-300 to-blue-400 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2"
      >
        <img src="src/assets/icons/react.png" alt="ícone react" />
      </button>

      <button
        data-framework="vue"
        type="button"
        class="text-gray-900 bg-gradient-to-r from-teal-200 via-teal-300 to-green-300 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-teal-100 font-medium rounded-lg text-sm px-5 py-2.5 text-center me-2 mb-2"
      >
        <img src="src/assets/icons/vue.png" alt="ícone vue" />
      </button>
    </ul>
    <div class="flex justify-center items-center h-full">
      <div id="doc-content"></div>
    </div>
  </body>
</html>
